name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux/amd64,   os: ubuntu-latest }
          - { target: linux/arm64,   os: ubuntu-24.04-arm }
          - { target: darwin/amd64,  os: macos-13 }
          - { target: darwin/arm64,  os: macos-latest }
          - { target: windows/amd64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -o bin/ ./cmd/metakill
      - name: Self-test
        shell: bash
        run: ./bin/metakill* --selftest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Race detector
        run: CGO_ENABLED=1 go test -race ./...

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: make release VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: metakill-binaries
          path: dist/*
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
