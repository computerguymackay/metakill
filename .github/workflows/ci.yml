name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux/amd64,   os: ubuntu-latest }
          - { target: linux/arm64,   os: ubuntu-24.04-arm }
          - { target: darwin/amd64,  os: macos-15-intel }
          - { target: darwin/arm64,  os: macos-latest }
          - { target: windows/amd64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      METAKILL_REQUIRE_7Z: "1" # 7z/RAR tests must run, not skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip
      # Windows runners ship 7-Zip in C:\Program Files\7-Zip.
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -o bin/ ./cmd/metakill
      - name: Self-test
        shell: bash
        run: ./bin/metakill* --selftest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - name: Race detector
        run: CGO_ENABLED=1 METAKILL_REQUIRE_7Z=1 go test -race ./...

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: make release VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: metakill-binaries
          path: dist/*
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
